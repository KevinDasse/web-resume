title = "Kévin Dassé"
baseURL = "https://KevinDasse.github.io/web-resume/"
theme = "resume"
languageCode = "fr-fr"
defaultContentLanguage = "fr"
PygmentsCodeFences = true
PygmentsCodeFencesGuessSyntax = true
PygmentsStyle = "monokai"
enableGitInfo = false

[params]
address = "Granville, France"
email = "KevinDasse@protonmail.com"
firstName = "Kévin"
lastName = "Dassé"
phone = "06 19 64 00 09"
profileImage = ""
showContact = true
showSocializations = true
sections = ["skills","creations","experience","education"]
vcardfields = [
    "name",
    "image",
    "org",
    "email",
    "phone",
    "url",
    "title"
]

[[params.handles]]
    name = "GitHub"
    link = "https://github.com/BlackPisces/"

[[params.handles]]
    name = "LinkedIn"
    link = "https://www.linkedin.com/in/k%C3%A9vin-dass%C3%A9/"

[outputs]
home = ["HTML", "JSON"]

[taxonomies]
tag = "tags"


[mediaTypes]
  [mediaTypes."text/vcard"]
    suffixes = ["vcf"]

[outputFormats]
  [outputFormats.VCard]
    mediaType = "text/vcard"
    baseName = "contact"
    isPlainText = true
    notAlternative = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'